{% extends "base.html" %}

{% block title %}Edit Todo{% endblock %}

{% block breadcrumb %}
<div class="breadcrumb-wrap">
  <nav class="breadcrumb-nav" aria-label="Breadcrumb">
    <a href="{% url 'home' %}"><i class="bi bi-house-door"></i> Home</a>
    <span class="crumb-sep"><i class="bi bi-chevron-right"></i></span>
    <a href="{% url 'projects' %}">Projects</a>
    <span class="crumb-sep"><i class="bi bi-chevron-right"></i></span>
    <a href="{% url 'todo' %}">Todo App</a>
    <span class="crumb-sep"><i class="bi bi-chevron-right"></i></span>
    <span class="crumb-current">Edit Todo</span>
  </nav>
</div>
{% endblock %}


{% block content %}
<div class="todo-page">

  <div class="todo-header">
    <div>
      <span class="todo-badge">
        <i class="bi bi-pencil-square"></i>
        Todo App
      </span>
      <h1>Edit Todo</h1>
      <p>Update your task details.</p>
    </div>
  </div>

  <div class="glass todo-add-card">
    <div class="todo-form-title">
      <i class="bi bi-pencil"></i>
      Edit Task
    </div>

    <form method="POST">
      {% csrf_token %}

      <div class="todo-input-group">
        <input type="text" name="title" value="{{ todo.title }}" maxlength="20" required autofocus>

        <button type="submit" class="todo-add-btn">
          <i class="bi bi-check-lg"></i>
          Update Todo
        </button>

        <a href="{% url 'todo' %}" class="todo-cancel-btn">
          Cancel
        </a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
