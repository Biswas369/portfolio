<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Edit Todo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #dbeafe, #f8fafc);
    }

    .card {
      width: 90%;
      max-width: 450px;
      padding: 30px;
      border-radius: 20px;

      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-bottom: 25px;
      color: #1e293b;
    }

    input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #3b82f6;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #475569;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Edit Todo</h1>

    <form method="POST">

      {% csrf_token %}

      <input type="text" name="title" value="{{ todo.title }}" maxlength="20" required>

      <button type="submit">
        Update Todo
      </button>

    </form>

    <a href="{% url 'todo' %}" class="back">
      ← Back to Todos
    </a>

  </div>

</body>

</html>
