{% extends "base.html" %}

{% block title %}
Add Todo
{% endblock %}


{% block breadcrumb %}
<div class="breadcrumb-wrap">
  <nav class="breadcrumb-nav" aria-label="Breadcrumb">
    <a href="{% url 'home' %}"><i class="bi bi-house-door"></i> Home</a>
    <span class="crumb-sep"><i class="bi bi-chevron-right"></i></span>
    <a href="{% url 'projects' %}">Projects</a>
    <span class="crumb-sep"><i class="bi bi-chevron-right"></i></span>
    <a href="{% url 'todo' %}">Todo App</a>
    <span class="crumb-sep"><i class="bi bi-chevron-right"></i></span>
    <span class="crumb-current">Add Todo</span>
  </nav>
</div>
{% endblock %}


{% block content %}

<div class="todo-page">

  <div class="todo-header">

    <div>
      <span class="todo-badge">
        <i class="bi bi-plus-circle"></i>
        Todo App
      </span>

      <h1>Add Todo</h1>

      <p>
        Create a new task for your todo list.
      </p>
    </div>

  </div>


  <!-- ADD TODO FORM -->

  <div class="glass todo-add-card">

    <div class="todo-form-title">
      <i class="bi bi-plus-circle"></i>
      Add New Todo
    </div>


    <form method="POST" action="{% url 'todo_add' %}">

      {% csrf_token %}

      <div class="todo-input-group">

        <input type="text" name="title" placeholder="What do you need to do?" required autofocus>


        <button type="submit" class="todo-add-btn">

          <i class="bi bi-plus-lg"></i>

          Add Todo

        </button>


        <a href="{% url 'todo' %}" class="todo-cancel-btn">

          Cancel

        </a>

      </div>

    </form>

  </div>

</div>

{% endblock %}
