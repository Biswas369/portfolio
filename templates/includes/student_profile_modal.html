<div class="student-modal-overlay" id="studentProfileModal" aria-hidden="true">
  <div class="student-profile-card glass" role="dialog" aria-modal="true" aria-labelledby="spName">
    <button type="button" class="student-profile-close" id="studentProfileClose" aria-label="Close">
      &times;
    </button>

    <div class="student-profile-top">
      <div class="student-avatar" id="spAvatar">ST</div>
      <div style="min-width:0;flex:1;">
        <h2 class="student-profile-name" id="spName">Student Name</h2>
        <p class="student-profile-role" id="spId">ID</p>
      </div>
      <span class="student-online-pill active" id="spStatus">
        <span class="dot"></span>
        <span id="spStatusText">Active</span>
      </span>
    </div>

    <div class="student-tags" id="spTags">
      <span class="student-tag" id="spCourse">Course</span>
    </div>

    <div class="student-profile-stats">
      <div class="stat-sep">
        <strong id="spAge">—</strong>
        <span>Age</span>
      </div>
      <div class="stat-sep">
        <strong id="spIdShort">—</strong>
        <span>Student ID</span>
      </div>
      <div>
        <strong id="spStatusStat">—</strong>
        <span>Status</span>
      </div>
    </div>

    <div class="student-info-list">
      <div class="student-info-row">
        <i class="bi bi-envelope"></i>
        <div>
          <span class="label">Email</span>
          <span class="value" id="spEmail">—</span>
        </div>
      </div>
      <div class="student-info-row">
        <i class="bi bi-telephone"></i>
        <div>
          <span class="label">Phone</span>
          <span class="value" id="spPhone">—</span>
        </div>
      </div>
      <div class="student-info-row">
        <i class="bi bi-geo-alt"></i>
        <div>
          <span class="label">Address</span>
          <span class="value" id="spAddress">—</span>
        </div>
      </div>
    </div>

    <div class="student-profile-actions">
      <a href="#" class="todo-add-btn" id="spEditBtn">
        <i class="bi bi-pencil"></i>
        Edit
      </a>
      <button type="button" class="app-btn-danger" id="spDeleteBtn">
        <i class="bi bi-trash3"></i>
        Delete
      </button>
      <button type="button" class="todo-cancel-btn" id="spCloseBtn">
        Close
      </button>
    </div>
  </div>
</div>
